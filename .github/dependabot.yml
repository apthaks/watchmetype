# Keeps the GitHub Actions used by the workflows up to date. (The site itself has no dependencies.)
# All action bumps arrive together as one monthly PR: "chore(deps): bump the actions group …".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
